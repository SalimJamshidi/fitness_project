<!doctype html>
<html lang="en">
  <head>
    <!-- Set the page metadata and load the styles shared across the site. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1D3525">
    <title>News | Salim Jamshidi</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
      /* Keep the news content above decorative layers and size it to the viewport. */
      .portfolio-content {
        position: relative;
        z-index: 1;
        min-height: calc(100vh - 120px);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Keep the site brand and page navigation consistent across pages. -->
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Salim Jamshidi home">
        <span class="brand-mark" aria-hidden="true">SJ</span>
        <span>SALIM <span class="brand-accent">JAMSHIDI</span></span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="news.html" aria-current="page">News</a>
        <a href="Fitness.html">Fitness</a>
      </nav>
    </header>

    <!-- Provide the container where the script loads and displays news cards. -->
    <main class="page-content portfolio-content">
      <section class="news-section">
        <h2> Latest News</h2>
        <div id="news-container">Loading latest news...</div>
      </section>
    </main>
    <!-- Load jQuery before the shared script that uses it. -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
